schema = 1
project = "forebay/stub-translator"
version = "1.2.0"

[modules]

[sources."forebay/basekit"]
kind = "github-releases"
repo = "forebay/basekit"
version = "5.0.0"

[plugins]
github = "./plugins/github.lua"
gradle = "./plugins/gradle.lua"

[[consumers]]
id = "stub"
language = "gradle"
file = "build.gradle"
configuration = "githubImplementation"

  [consumers.dependencies."forebay/basekit"]
  version = "^5.0.0"
  modules = ["ir"]
