schema = 1
project = "forebay/basekit"
version = "5.0.0"

[modules.contracts]

  [modules.contracts.gradle]
  coordinate = "forebay:basekit:5.0.0:contracts"

  [modules.contracts.npm]
  package = "@intisy-ai/basekit-contracts"
  range = "^5.0.0"

  [modules.contracts.c]
  package = "basekit-contracts"
