  [modules.ir.gradle]
  coordinate = "forebay:basekit:5.0.0:ir"

  [modules.ir.npm]
  package = "@intisy-ai/basekit-ir"
  range = "^5.0.0"

  [modules.ir.c]
  package = "basekit-ir"
  url = "https://example.test/basekit-ir-5.0.0.tar.gz"
  sha256 = "9f2e1c4b"
