schema = 1
project = "forebay/example"
version = "1.0.0"

[modules]

[sources."forebay/basekit"]
kind = "path"
path = "./producer-languages"

[plugins]
path = "./plugins/path.lua"
npm = "./plugins/npm.lua"

[[consumers]]
id = "tooling"
language = "npm"
file = "package.json"
configuration = "devDependencies"

  [consumers.dependencies."forebay/basekit"]
  version = "^5.0.0"
  modules = ["contracts"]

[[consumers]]
id = "runtime"
language = "npm"
file = "package.json"
configuration = "dependencies"

  [consumers.dependencies."forebay/basekit"]
  version = "^5.0.0"
  modules = ["ir"]
