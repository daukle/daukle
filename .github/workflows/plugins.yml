name: Plugins

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/plugins.yml'

permissions:
  contents: read

jobs:
  plugins:
    uses: intisy/workflows/.github/workflows/downstream.yml@downstream-dispatch
    with:
      # Every one of these builds daukle from source, so their suites are what says whether a
      # change here still satisfies the plugins written against it. Nothing in daukle's own suite
      # covers that: the coverage moved out to these repositories and the report never came back.
      repositories: '["daukle/daukle"]'
    secrets:
      envPAT: ${{ secrets.PAT || github.token }}
