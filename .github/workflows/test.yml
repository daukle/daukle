name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      line_endings: true
      toolchains: cmake
      runners: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      cmake_configure: '-B build -DCMAKE_BUILD_TYPE=Release'
      cmake_build: '--build build --config Release'
      cmake_test: 'DAUKLE_NETWORK_TESTS=1 ctest --test-dir build -C Release -VV -R wrapper_pin_matches_release'
      apt_packages: libcurl4-openssl-dev
    secrets:
      envPAT: ${{ secrets.PAT }}
