# The pinned daukle this project builds with. Both wrapper scripts read it, and an upgrade is a
# change to this file alone, which is why the pin does not live inside the scripts.
#
# Every digest is of the PUBLISHED asset, never of a file on disk: a digest taken from a working
# tree is a digest of whatever the checkout did to the bytes, and fourteen repositories here carry
# CRLF blobs.
#
# This file is GENERATED by a release and should not be edited by hand. The release job runs
# cmake/write_wrapper_pin.cmake once every cell has uploaded, which is the first moment the
# digests exist, and publishes the result as the wrapper.toml asset. The ctest entry
# wrapper_pin_matches_release holds this copy to the latest published release.
version = "0.13.0"

# Where daukle migrate looks for plugins, passed to daukle as DAUKLE_CATALOGS when that is unset.
# Only the locations are pinned here: what each catalog lists is fetched when migrate runs, so a
# new plugin reaches every project without a new release.
catalogs = ["https://raw.githubusercontent.com/daukle/manifest/main/plugins.json"]

# One section per host, keyed as daukle spells it itself (fr_lua_host_os/fr_lua_host_arch). A host
# with no section is refused by name rather than failing on a 404 at download time, so the two
# cells this release does not cover say so. Both Mac hosts name ONE universal binary.
[assets."linux/x86_64"]
asset = "daukle-linux-x86_64"
sha256 = "ba196c9f1274cb44f932e6c71007ae862809638e2a836ac537df9cc6c4eb6bb9"

[assets."macos/aarch64"]
asset = "daukle-macos-universal"
sha256 = "b41ed7635596bdbe2a4becb7b864f9c605793e80eec7bd9aaf1a466d58828902"

[assets."macos/x86_64"]
asset = "daukle-macos-universal"
sha256 = "b41ed7635596bdbe2a4becb7b864f9c605793e80eec7bd9aaf1a466d58828902"

[assets."windows/x86_64"]
asset = "daukle-windows-x86_64.exe"
sha256 = "d1654a392d2ff09abef39e3d773acee0a09d2bef61e8b60c94c549b76ba90f8b"
